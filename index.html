<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON RUNNER: CYBER CITY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- Live In-Game HUD -->
        <div id="hud">
          <div class="hud-top">
            <div class="hud-left">
              <div class="level-badge" id="level-name">LEVEL 01: NEON DISTRICT</div>
              <div class="lives-wrap">
                <span class="lives-label">LIFE MATRIX</span>
                <span class="lives">♥ ♥ ♥</span>
              </div>
            </div>

            <div class="hud-center">
              <div id="shield-indicator" class="hidden">
                <span class="shield-badge">🛡️ SHIELD ACTIVE</span>
              </div>
            </div>

            <div class="hud-right">
              <div class="hud-metrics">
                <div class="metric-item">
                  <span class="metric-label">DATA COINS</span>
                  <span class="metric-value coin-val">🪙 <span id="coins-count">000</span></span>
                </div>
                <div class="metric-item">
                  <span class="metric-label">SCORE CHIPS</span>
                  <span class="metric-value score-val"><span id="score">000000</span></span>
                </div>
              </div>
              
              <div class="hud-quick-buttons">
                <button id="pause-btn" class="icon-hud-btn" title="Pause Game [P]">⏸️ PAUSE</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Dynamic Game States Overlay (Start / Pause / Game Over) -->
        <div id="ui-overlay"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
